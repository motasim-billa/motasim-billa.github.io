# Pages CMS configuration (pagescms.org)
# Sign in at app.pagescms.org with GitHub, open this repository, and edit the
# site's content through forms. All content lives in one file —
# assets/content.json — which the site loads and renders. Saving in the CMS
# commits the change to GitHub and the live site updates itself.
#
# Media: uploads are stored in the assets folder and referenced by path
# (e.g. assets/news-example.jpg), the same way the site already links images.
#
# Schema note: every repeatable list is declared as type: object with
# list: true and its own fields list, so the panel renders each item as an
# expandable, individually editable card. Lists of plain text lines are
# type: string with list: true.
media:
  input: assets
  output: /assets

content:
  - name: content
    label: Site Content
    description: Every word on the website — profile, publications, newspaper archive, stories, CV and contact.
    type: file
    path: assets/content.json
    format: json
    fields:
      - name: profile
        label: Profile & About Page
        type: object
        fields:
          - name: name
            label: Full name
            type: string
          - name: tagline
            label: Tagline (shown under the name in the header)
            type: string
          - name: nameDisplayHtml
            label: Name in the big heading (HTML — <em>…</em> makes the italic part)
            type: string
          - name: statusHtml
            label: Status line under the heading (HTML — <strong>…</strong> is bold)
            type: text
          - name: bio
            label: Bio paragraphs (one item per paragraph)
            type: string
            list: true
          - name: email
            label: Email address
            type: string
          - name: linkedin
            label: LinkedIn profile URL
            type: string
          - name: orcid
            label: ORCID profile URL
            type: string
          - name: researchgate
            label: ResearchGate profile URL
            type: string
          - name: copyright
            label: Footer — copyright line
            type: string
          - name: footerNote
            label: Footer — right-hand note
            type: string
      - name: aboutTabTitle
        label: About page — browser tab title
        type: string
      - name: publications
        label: Publications
        type: object
        fields:
          - name: tabTitle
            label: Browser tab title
            type: string
          - name: folio
            label: Small label above the heading
            type: string
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro paragraph
            type: text
          - name: groups
            label: Year groups
            type: object
            list: true
            fields:
              - name: label
                label: Group label (e.g. “2026” or “In progress”)
                type: string
              - name: entries
                label: Publications in this group
                type: object
                list: true
                fields:
                  - name: title
                    label: Title
                    type: string
                  - name: type
                    label: Type badge (e.g. Journal article, Conference paper, MS thesis)
                    type: string
                    required: false
                  - name: status
                    label: Status badge (e.g. Under review, Accepted — leave empty for none)
                    type: string
                    required: false
                  - name: authorsHtml
                    label: Author line (HTML — <b>…</b> bolds a name, <i>…</i> italicises the venue)
                    type: text
                  - name: note
                    label: Short descriptive note
                    type: text
                  - name: link
                    label: Link URL (e.g. DOI link — makes the title clickable, leave empty for none)
                    type: string
                    required: false
          - name: note
            label: Closing note under the list
            type: text
      - name: newspaper
        label: Newspaper Writing
        type: object
        fields:
          - name: tabTitle
            label: Browser tab title
            type: string
          - name: folio
            label: Small label above the heading
            type: string
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line under the heading
            type: text
          - name: introParagraphsHtml
            label: Intro paragraphs (HTML — <i>…</i> italicises newspaper names, <b>…</b> is bold)
            type: string
            list: true
          - name: articles
            label: Newspaper articles (in display order — the first one is the wide featured card)
            type: object
            list: true
            fields:
              - name: headline
                label: Headline (English)
                type: string
              - name: headlineBn
                label: Headline (Bengali — leave empty for English-only articles)
                type: string
                required: false
              - name: meta
                label: Meta line (newspaper · year · byline)
                type: string
              - name: image
                label: Part 1 — the titled page (image)
                type: image
              - name: imageAlt
                label: Part 1 — image description (alt text)
                type: text
              - name: continuationImage
                label: Part 2 — continuation page (image, if one survives)
                type: image
                required: false
              - name: continuationAlt
                label: Part 2 — image description (alt text)
                type: text
                required: false
              - name: caption
                label: Caption shown enlarged (publication, year, byline)
                type: text
              - name: jumpNote
                label: Note about the second part, shown enlarged
                type: text
              - name: readHint
                label: Card link text (“Read both parts →” or “Read the clipping →”)
                type: string
              - name: wide
                label: Wide card (spans two columns)
                type: boolean
          - name: note
            label: Closing note under the gallery
            type: text
      - name: chronicles
        label: Chronicles (Stories)
        type: object
        fields:
          - name: tabTitle
            label: Browser tab title
            type: string
          - name: folio
            label: Small label above the heading
            type: string
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro paragraph
            type: text
          - name: stories
            label: Stories
            type: object
            list: true
            fields:
              - name: id
                label: Page address (e.g. story-cci — the page opens at #story-cci)
                type: string
              - name: tabTitle
                label: Browser tab title
                type: string
              - name: title
                label: Story title
                type: string
              - name: cardMeta
                label: Card — meta line (dates · place)
                type: string
              - name: introHtml
                label: Card — intro text (HTML allowed)
                type: text
              - name: image
                label: Card — photo (leave empty to use the text badge instead)
                type: image
                required: false
              - name: imageAlt
                label: Card — photo description (alt text)
                type: text
                required: false
              - name: badgeText
                label: Card — badge letters when there is no photo (e.g. CCI)
                type: string
                required: false
              - name: badgeSub
                label: Card — badge small line (e.g. Virginia · 2021–22)
                type: string
                required: false
              - name: pageMeta
                label: Story page — meta line under the title
                type: string
              - name: paragraphsHtml
                label: Story text (one item per paragraph, HTML allowed)
                type: string
                list: true
              - name: sections
                label: Extra headed sections (used by “Beyond the desk”)
                type: object
                list: true
                required: false
                fields:
                  - name: heading
                    label: Section heading
                    type: string
                  - name: paragraphsHtml
                    label: Paragraphs (one item per paragraph, HTML allowed)
                    type: string
                    list: true
      - name: cv
        label: CV Page
        type: object
        fields:
          - name: tabTitle
            label: Browser tab title
            type: string
          - name: folio
            label: Small label above the heading
            type: string
          - name: heading
            label: Heading
            type: string
          - name: rows
            label: CV table rows
            type: object
            list: true
            fields:
              - name: label
                label: Row label
                type: string
              - name: valueHtml
                label: Row value (HTML allowed)
                type: text
          - name: checklist
            label: Site checklist
            type: object
            list: true
            fields:
              - name: text
                label: Item
                type: string
              - name: done
                label: Done
                type: boolean
          - name: profileLinks
            label: Profile links (buttons)
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: url
                label: URL
                type: string
          - name: pendingLinks
            label: Profiles still to add (shown as placeholders)
            type: object
            list: true
            fields:
              - name: label
                label: Label
                type: string
              - name: title
                label: Tooltip
                type: string
          - name: cvPdf
            label: CV file (PDF)
            type: file
          - name: downloadLabel
            label: Download button text
            type: string
          - name: updatedNote
            label: “Last updated” note
            type: string
      - name: contact
        label: Contact Page
        type: object
        fields:
          - name: tabTitle
            label: Browser tab title
            type: string
          - name: folio
            label: Small label above the heading
            type: string
          - name: heading
            label: Heading
            type: string
          - name: boxHeading
            label: Blue box — heading
            type: string
          - name: boxTextHtml
            label: Blue box — text (HTML — includes the email and LinkedIn links)
            type: text
          - name: emailSubject
            label: Subject line for the “Send an email” button
            type: string
