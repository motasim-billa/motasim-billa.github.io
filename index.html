<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Md Motasim Billa — Information Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfcf8; --bg-2:#f6f2ea; --surface:#ffffff; --surface-2:#f9f6f0;
    --text:#172033; --muted:#5b6678; --faint:#8a94a6;
    --line:#e7e0d1; --line-2:#ddd5c2;
    --maroon:#7a1f2e; --maroon-2:#5e1622; --navy:#1b3556; --gold:#b9975b;
    --chip:#efe9db; --shadow:0 10px 28px rgba(23,32,51,.07);
    --frame-shadow:0 2px 6px rgba(23,32,51,.08),0 14px 30px rgba(23,32,51,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --bg-2:#141922; --surface:#171c27; --surface-2:#1c2333;
      --text:#eceef3; --muted:#a7b0c0; --faint:#7e8a9e;
      --line:#2a3246; --line-2:#343e57;
      --maroon:#e08a97; --maroon-2:#f0aab4; --navy:#9db8dd; --gold:#cbb07a;
      --chip:#232b3e; --shadow:0 10px 28px rgba(0,0,0,.35);
      --frame-shadow:0 2px 6px rgba(0,0,0,.4),0 14px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Public Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--maroon);text-decoration:none}
  a:hover{text-decoration:underline}
  img{max-width:100%;display:block}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px}
  /* header */
  header.site{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .monogram{width:40px;height:40px;border-radius:10px;background:var(--maroon);color:#fff;display:grid;place-items:center;font-family:"Newsreader",serif;font-weight:700;font-size:17px;flex-shrink:0}
  @media (prefers-color-scheme: dark){.monogram{background:#7a2436}}
  .brand b{display:block;font-size:15px;line-height:1.1;white-space:nowrap}
  .brand small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.links{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
  nav.links a{color:var(--text);font-size:14px;font-weight:500;padding:7px 9px;border-radius:999px;white-space:nowrap}
  nav.links a:hover{background:var(--chip);text-decoration:none}
  nav.links a.active{background:var(--text);color:var(--bg)}
  .menu-btn{display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;color:var(--text)}
  /* page views — one visible at a time, switched by the top menu */
  .view{padding:44px 0 48px}
  .view[hidden]{display:none}
  .view-head{margin-bottom:22px;max-width:880px}
  .view-head h2{font-family:"Newsreader",serif;font-size:36px;line-height:1.05;margin:0;letter-spacing:-.01em}
  .view-head p{margin:9px 0 0;color:var(--muted);font-size:15.5px}
  .folio{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;display:block;margin-bottom:8px}
  /* hero — deliberately short, lives on the About view */
  .hero{padding:8px 0 0}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--maroon);font-weight:600;margin:0 0 14px}
  h1{font-family:"Newsreader",serif;font-size:clamp(42px,6.4vw,64px);line-height:1;letter-spacing:-.02em;margin:0}
  h1 em{font-style:italic;font-weight:500}
  /* nameplate rule — thick over thin, like a newspaper masthead */
  .nameplate{border-top:3px solid var(--text);border-bottom:1px solid var(--text);height:5px;margin:20px 0 0}
  .role{font-size:19px;line-height:1.45;margin:14px 0 0;max-width:880px}
  .role strong{font-weight:700}
  .lede{margin:10px 0 0;color:var(--muted);font-size:16px;max-width:880px}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit}
  .btn:hover{text-decoration:none;transform:translateY(-1px)}
  .btn.primary{background:var(--maroon);border-color:var(--maroon);color:#fff}
  @media (prefers-color-scheme: dark){.btn.primary{background:#8e2a3d;border-color:#8e2a3d}}
  .btn.primary:hover{background:var(--maroon-2)}
  /* narrative prose */
  .prose{max-width:880px}
  .prose p{margin:0 0 14px;font-size:16px}
  .bio p{margin:0 0 1em}
  .bio p:last-child{margin-bottom:0}
  .prose p:last-child{margin-bottom:0}
  .sub-block{padding:34px 0 0;margin-top:38px;border-top:1px solid var(--line)}
  .sub-block > h3{font-family:"Newsreader",serif;font-size:26px;line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
  .sub-block > .sub-lede{margin:0 0 18px;color:var(--muted);font-size:15px;max-width:880px}
  /* publications — the focus */
  .pub-group{padding:18px 0;border-top:1px solid var(--line)}
  .pub-group:first-of-type{border-top:none;padding-top:2px}
  .pub-group h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--maroon);margin:0 0 8px}
  .pub-group p{margin:0;color:var(--muted);font-size:15px}
  .pub-entry{padding:12px 0 2px}
  .pub-entry .pt{font-family:"Newsreader",serif;font-size:18.5px;line-height:1.32;font-weight:600;display:block}
  .pub-entry .pa{margin:5px 0 0;font-size:14.5px;color:var(--muted)}
  .pub-entry .pa b{color:var(--text)}
  .pub-entry .pub-note{margin:5px 0 0;font-size:13.5px;color:var(--faint);max-width:880px}
  .status{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--maroon);margin-left:8px;vertical-align:2px;white-space:nowrap}
  .ptype{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--navy);margin-left:8px;vertical-align:2px;white-space:nowrap}
  /* research */
  .research-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 36px}
  .research-list div{padding:12px 0;border-top:1px solid var(--line)}
  .research-list h3{margin:0 0 3px;font-size:15.5px}
  .research-list p{margin:0;color:var(--muted);font-size:14px}
  .keywords{margin:18px 0 0;color:var(--muted);font-size:13.5px}
  .keywords b{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;margin-right:10px}
  /* newspaper writing — framed clippings; cards show Part 1 only, the continuation opens on click */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  figure.clipping{margin:0;background:var(--surface);border:1px solid var(--line-2);padding:10px 10px 14px;box-shadow:var(--frame-shadow);display:flex;flex-direction:column}
  figure.clipping.wide{grid-column:span 2}
  .part-tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;display:block;margin:2px 2px 8px}
  .clip-btn{display:block;width:100%;padding:0;border:none;background:none;cursor:zoom-in}
  .clip-btn img{width:100%;height:auto;max-height:560px;object-fit:contain;background:var(--surface-2);border:1px solid var(--line)}
  .clip-btn:focus-visible{outline:2px solid var(--maroon);outline-offset:3px}
  .read-hint{display:block;margin-top:auto;padding:11px 4px 0;font-size:13px;font-weight:600;color:var(--maroon)}
  figcaption{padding:12px 4px 0}
  figcaption .hl{font-family:"Newsreader",serif;font-size:16.5px;line-height:1.3;font-weight:600;display:block}
  figcaption .hl-bn{display:block;margin-top:3px;font-size:13.5px;color:var(--text);opacity:.85;line-height:1.5}
  figcaption .meta{display:block;margin-top:7px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .gallery-note{margin:22px 0 0;color:var(--muted);font-size:14px;max-width:880px}
  /* newspaper writing — two tabs: Fact-Check (shown first) and News clippings */
  .news-tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
  .news-tab{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;padding:9px 18px;border-radius:999px;cursor:pointer}
  .news-tab:hover{border-color:var(--gold)}
  .news-tab[aria-selected="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
  @media (prefers-color-scheme: dark){.news-tab[aria-selected="true"]{background:#8e2a3d;border-color:#8e2a3d}}
  .news-tab .tab-count{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;opacity:.75;margin-left:6px}
  .news-panel[hidden]{display:none}
  .fc-intro{margin:0 0 20px;color:var(--muted);font-size:15.5px;max-width:880px}
  .fc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .fc-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--frame-shadow);color:var(--text)}
  .fc-card:hover{text-decoration:none;border-color:var(--gold)}
  .fc-card:focus-visible{outline:2px solid var(--maroon);outline-offset:3px}
  .fc-card img{width:100%;aspect-ratio:3/2;object-fit:cover;border-bottom:1px solid var(--line)}
  .fc-body{padding:15px 17px 17px;display:flex;flex-direction:column;flex:1}
  .fc-meta{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .fc-card h3{font-family:"Newsreader",serif;font-size:19.5px;line-height:1.25;margin:7px 0 0}
  .fc-card p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
  .fc-card .read-hint{padding:12px 0 0}
  /* stories — a news-portal grid of story cards; each card opens the full story as its own view */
  .story-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .story-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--frame-shadow);color:var(--text)}
  .story-card:hover{text-decoration:none;border-color:var(--gold)}
  .story-card:focus-visible{outline:2px solid var(--maroon);outline-offset:3px}
  .story-card img.sc-img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;border-bottom:1px solid var(--line)}
  .sc-typo{aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg-2);border-bottom:1px solid var(--line)}
  .sc-typo b{font-family:"Newsreader",serif;font-size:54px;font-weight:700;letter-spacing:.02em;color:var(--maroon);line-height:1}
  .sc-typo span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .sc-body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
  .sc-meta{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .story-card h3{font-family:"Newsreader",serif;font-size:21.5px;line-height:1.2;margin:7px 0 0}
  .story-card p{margin:8px 0 0;color:var(--muted);font-size:14.5px}
  .story-card .read-hint{padding:12px 0 0}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--maroon);margin-bottom:18px}
  .back-link.bottom{margin:26px 0 0}
  .view-head p.story-meta{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:12px}
  /* CV */
  .cv-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:36px;align-items:start}
  .cv-table{width:100%;border-collapse:collapse;font-size:14.5px}
  .cv-table th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);width:32%;vertical-align:top}
  .cv-table td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:break-word}
  .cv-table tr:last-child th,.cv-table tr:last-child td{border-bottom:none}
  .checklist{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14.5px}
  .checklist li{display:flex;gap:10px}
  .checklist li::before{content:"○";color:var(--maroon);font-weight:700;flex-shrink:0}
  .checklist li.done::before{content:"●";color:#2e7d4f}
  .side-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .side-links a,.side-links span{font-size:13px;font-weight:600;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)}
  .side-links span{color:var(--muted);border-style:dashed;font-weight:500}
  /* contact */
  .contact-box{background:var(--navy);color:#fff;border-radius:20px;padding:26px 28px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
  @media (prefers-color-scheme: dark){.contact-box{background:#1a2740}}
  .contact-box h2{font-family:"Newsreader",serif;font-size:28px;margin:0 0 6px;line-height:1.1}
  .contact-box p{margin:0;opacity:.88;font-size:14.5px;max-width:480px}
  .contact-box a{color:#fff;text-decoration:underline;text-underline-offset:3px}
  .contact-actions{display:flex;flex-direction:column;gap:10px;align-items:stretch}
  .contact-actions .btn{background:#fff;color:#172033;border-color:#fff;justify-content:center}
  .contact-actions .btn.secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
  .toast{font-size:13px;text-align:center;min-height:18px;opacity:.9}
  footer{padding:26px 0 38px;color:var(--muted);font-size:13.5px}
  .stealth-link{color:inherit;text-decoration:none}
  .stealth-link:hover{color:inherit;text-decoration:none}
  footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
  /* lightbox — shows an article's two parts together */
  .lightbox{position:fixed;inset:0;z-index:50;background:rgba(12,14,20,.9);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
  .lightbox.open{display:flex}
  .lightbox figure{margin:auto;max-width:min(880px,100%);background:var(--surface);padding:12px;border-radius:6px}
  .lightbox .lb-part + .lb-part{margin-top:14px;border-top:1px dashed var(--line-2);padding-top:12px}
  .lightbox img{width:100%;height:auto}
  .lightbox figcaption{padding:10px 4px 2px;color:var(--text)}
  .lb-jump-note{font-size:13.5px;color:var(--muted);margin:0;padding:2px 4px 0}
  .lb-part2-img{margin:0 0 10px;border:1px solid var(--line)}
  .lb-part2-img[hidden]{display:none}
  .lb-close{position:fixed;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;font-size:19px;cursor:pointer;z-index:2}
  @media (max-width:1100px){
    .gallery{grid-template-columns:repeat(3,1fr)}
    .fc-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:860px){
    .gallery{grid-template-columns:1fr 1fr}
    figure.clipping.wide{grid-column:span 2}
    .cv-grid,.research-list{grid-template-columns:1fr}
    .contact-box{flex-direction:column;align-items:stretch}
  }
  @media (max-width:640px){
    .wrap{padding:0 20px}
    .view{padding:30px 0 38px}
    .view-head h2{font-size:30px}
    .cv-table th,.cv-table td{display:block;width:auto;padding-left:0}
    .cv-table th{border-bottom:none;padding-bottom:0}
    .cv-table td{padding-top:2px}
  }
  @media (max-width:560px){
    .gallery{grid-template-columns:1fr}
    .fc-grid{grid-template-columns:1fr}
    .story-grid{grid-template-columns:1fr}
    figure.clipping.wide{grid-column:span 1}
    .clip-btn img{max-height:70vh}
    nav.links{display:none}
    nav.links.open{display:flex;width:100%;justify-content:flex-start;padding-bottom:6px}
    .nav{flex-wrap:wrap}
    .menu-btn{display:inline-flex}
    .hero-actions .btn{flex:1 1 auto;justify-content:center}
  }
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} .btn:hover{transform:none}}
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <div class="brand">
      <div class="monogram" aria-hidden="true">MB</div>
      <div>
        <b id="brandName">Md Motasim Billa</b>
        <small id="brandTagline">Information Science · UA Little Rock</small>
      </div>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
    <nav class="links" id="navLinks" aria-label="Primary">
      <a href="#about" data-view-link="about" class="active">About</a>
      <a href="#publications" data-view-link="publications">Publications</a>
      <a href="#writing" data-view-link="writing">Newspaper Writing</a>
      <a href="#stories" data-view-link="stories">Chronicles</a>
      <a href="#cv" data-view-link="cv">CV</a>
      <a href="#contact" data-view-link="contact">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">

  <!-- Views are rendered by the script below from assets/content.json -->
  <section class="view" id="view-about" data-view="about"></section>
  <section class="view" id="view-publications" data-view="publications" hidden></section>
  <section class="view" id="view-writing" data-view="writing" hidden></section>
  <section class="view" id="view-stories" data-view="stories" hidden></section>
  <!-- one page per Chronicles story is inserted here, before the CV view -->
  <section class="view" id="view-cv" data-view="cv" hidden></section>
  <section class="view" id="view-contact" data-view="contact" hidden></section>
  <noscript><p style="padding:24px 0">This site loads its content from a data file, so it needs JavaScript enabled to display. Please enable JavaScript and reload the page.</p></noscript>
</main>

<footer>
  <div class="wrap">
    <span id="footCopy">© 2026 Md Motasim Billa</span>
    <span id="footNote">Designed for GitHub Pages · motasim-billa.github.io</span>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Newspaper clipping, enlarged">
  <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <figure>
    <div class="lb-part">
      <span class="part-tag">Part 1 · The titled page</span>
      <img id="lbImg" alt="Newspaper clipping, enlarged view">
    </div>
    <div class="lb-part" id="lbPart2">
      <span class="part-tag" id="lbPart2Tag">Part 2 · The continuation (jump)</span>
      <img class="lb-part2-img" id="lbImg2" alt="" hidden>
      <p class="lb-jump-note" id="lbJump"></p>
    </div>
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<script>
(function(){
  var mainEl=document.getElementById('main');
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function escA(s){return esc(s).replace(/"/g,'&quot;');}
  function paras(list,raw){return (list||[]).map(function(t){return '<p>'+(raw?t:esc(t))+'</p>';}).join('');}
  function viewHead(folio,heading,intro){
    return '<div class="view-head"><span class="folio">'+esc(folio)+'</span><h2>'+esc(heading)+'</h2>'
      +(intro?'<p>'+esc(intro)+'</p>':'')+'</div>';
  }

  function render(D){
    var P=D.profile;
    document.getElementById('brandName').textContent=P.name;
    document.getElementById('brandTagline').textContent=P.tagline;
    var footCopyEl=document.getElementById('footCopy');
    if(P.copyright==='© 2026 Md Motasim Billa'){
      var stealth=document.createElement('a');
      stealth.className='stealth-link';
      stealth.href='https://app.pagescms.org/motasim-billa/motasim-billa.github.io/main/file/content';
      stealth.textContent=P.copyright;
      footCopyEl.textContent='';
      footCopyEl.appendChild(stealth);
    } else {
      footCopyEl.textContent=P.copyright;
    }
    document.getElementById('footNote').textContent=P.footerNote;

    /* About */
    document.getElementById('view-about').innerHTML=
      '<div class="hero">'
      +'<h1>'+P.nameDisplayHtml+'</h1>'
      +'<p class="role">'+P.statusHtml+'</p>'
      +'<div class="nameplate" aria-hidden="true"></div>'
      +'<div class="prose bio" style="margin-top:16px">'+paras(P.bio,false)+'</div>'
      +'<div class="hero-actions">'
      +'<a class="btn primary" href="mailto:'+escA(P.email)+'">✉ &nbsp;'+esc(P.email)+'</a>'
      +'<a class="btn" href="'+escA(P.linkedin)+'" target="_blank" rel="noopener">LinkedIn ↗</a>'
      +'</div></div>';

    /* Publications */
    var PB=D.publications;
    document.getElementById('view-publications').innerHTML=
      viewHead(PB.folio,PB.heading,PB.intro)
      +PB.groups.map(function(g){
        return '<div class="pub-group"><h3>'+esc(g.label)+'</h3>'
          +g.entries.map(function(e){
            return '<div class="pub-entry"><span class="pt">'+esc(e.title)
              +(e.type?'<span class="ptype">'+esc(e.type)+'</span>':'')
              +(e.status?'<span class="status">'+esc(e.status)+'</span>':'')
              +'</span><p class="pa">'+e.authorsHtml+'</p>'
              +'<p class="pub-note">'+esc(e.note)+'</p></div>';
          }).join('')+'</div>';
      }).join('')
      +'<p class="gallery-note">'+esc(PB.note)+'</p>';

    /* Newspaper Writing — two tabs: Fact-Check first, then the News clippings */
    var N=D.newspaper;
    var FC=N.factChecks||[];
    document.getElementById('view-writing').innerHTML=
      viewHead(N.folio,N.heading,N.intro)
      +'<div class="news-tabs" role="tablist" aria-label="Newspaper writing sections">'
      +'<button class="news-tab" type="button" role="tab" id="tab-factcheck" aria-selected="true" aria-controls="panel-factcheck" data-news-tab="factcheck">Fact-Check<span class="tab-count">'+FC.length+' stories</span></button>'
      +'<button class="news-tab" type="button" role="tab" id="tab-news" aria-selected="false" aria-controls="panel-news" data-news-tab="news">News<span class="tab-count">'+N.articles.length+' clippings</span></button>'
      +'</div>'
      +'<div class="news-panel" id="panel-factcheck" role="tabpanel" aria-labelledby="tab-factcheck">'
      +(N.factCheckIntro?'<p class="fc-intro">'+esc(N.factCheckIntro)+'</p>':'')
      +'<div class="fc-grid">'
      +FC.map(function(f){
        return '<a class="fc-card" href="'+escA(f.url)+'" target="_blank" rel="noopener">'
          +'<img src="'+escA(f.image)+'" alt="'+escA(f.imageAlt)+'" loading="lazy">'
          +'<span class="fc-body"><span class="fc-meta">'+esc(f.meta)+'</span>'
          +'<h3>'+esc(f.title)+'</h3><p>'+esc(f.summary)+'</p>'
          +'<span class="read-hint">Read on The Dissent ↗</span></span></a>';
      }).join('')
      +'</div></div>'
      +'<div class="news-panel" id="panel-news" role="tabpanel" aria-labelledby="tab-news" hidden>'
      +'<div class="prose" style="margin-bottom:26px">'+paras(N.introParagraphsHtml,true)+'</div>'
      +'<div class="gallery">'
      +N.articles.map(function(a){
        return '<figure class="clipping'+(a.wide?' wide':'')+'">'
          +'<span class="part-tag">Part 1 · The titled page</span>'
          +'<button class="clip-btn" type="button" data-full="'+escA(a.image)+'"'
          +(a.continuationImage?' data-full2="'+escA(a.continuationImage)+'" data-alt2="'+escA(a.continuationAlt)+'"':'')
          +' data-cap="'+escA(a.caption)+'" data-jump="'+escA(a.jumpNote)+'">'
          +'<img src="'+escA(a.image)+'" alt="'+escA(a.imageAlt)+'" loading="lazy"></button>'
          +'<figcaption><span class="hl">'+esc(a.headline)+'</span>'
          +(a.headlineBn?'<span class="hl-bn" lang="bn">'+esc(a.headlineBn)+'</span>':'')
          +'<span class="meta">'+esc(a.meta)+'</span></figcaption>'
          +'<span class="read-hint">'+esc(a.readHint)+'</span></figure>';
      }).join('')
      +'</div>'
      +'<p class="gallery-note">'+esc(N.note)+'</p></div>';

    /* Chronicles — story cards */
    var C=D.chronicles;
    document.getElementById('view-stories').innerHTML=
      viewHead(C.folio,C.heading,C.intro)
      +'<div class="story-grid">'
      +C.stories.map(function(s){
        return '<a class="story-card" href="#'+escA(s.id)+'" data-view-link="'+escA(s.id)+'">'
          +(s.image
            ?'<img class="sc-img" src="'+escA(s.image)+'" alt="'+escA(s.imageAlt)+'" loading="lazy">'
            :'<span class="sc-typo" aria-hidden="true"><b>'+esc(s.badgeText)+'</b><span>'+esc(s.badgeSub)+'</span></span>')
          +'<span class="sc-body"><span class="sc-meta">'+esc(s.cardMeta)+'</span>'
          +'<h3>'+esc(s.title)+'</h3><p>'+s.introHtml+'</p>'
          +'<span class="read-hint">Read the story →</span></span></a>';
      }).join('')
      +'</div>';

    /* Chronicles — one full page per story, inserted before the CV view */
    var cvSection=document.getElementById('view-cv');
    C.stories.forEach(function(s){
      var sec=document.createElement('section');
      sec.className='view'; sec.id='view-'+s.id; sec.setAttribute('data-view',s.id); sec.hidden=true;
      sec.innerHTML=
        '<a class="back-link" href="#stories" data-view-link="stories">← All chronicles</a>'
        +'<div class="view-head"><span class="folio">'+esc(C.folio)+'</span><h2>'+esc(s.title)+'</h2>'
        +'<p class="story-meta">'+esc(s.pageMeta)+'</p></div>'
        +'<div class="prose">'+paras(s.paragraphsHtml,true)+'</div>'
        +(s.sections||[]).map(function(x){
          return '<div class="sub-block"><h3>'+esc(x.heading)+'</h3><div class="prose">'+paras(x.paragraphsHtml,true)+'</div></div>';
        }).join('')
        +'<a class="back-link bottom" href="#stories" data-view-link="stories">← Back to Chronicles</a>';
      cvSection.parentNode.insertBefore(sec,cvSection);
    });

    /* CV */
    var V=D.cv;
    cvSection.innerHTML=
      viewHead(V.folio,V.heading,null)
      +'<div class="cv-grid"><table class="cv-table">'
      +V.rows.map(function(r){return '<tr><th>'+esc(r.label)+'</th><td>'+r.valueHtml+'</td></tr>';}).join('')
      +'</table><div><ul class="checklist">'
      +V.checklist.map(function(i){return '<li'+(i.done?' class="done"':'')+'>'+esc(i.text)+'</li>';}).join('')
      +'</ul><div class="side-links">'
      +V.profileLinks.map(function(l){return '<a href="'+escA(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>';}).join('')
      +V.pendingLinks.map(function(x){return '<span title="'+escA(x.title)+'">'+esc(x.label)+'</span>';}).join('')
      +'</div>'
      +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">'
      +'<a class="btn primary" href="'+escA(V.cvPdf)+'" target="_blank" rel="noopener">'+esc(V.downloadLabel)+'</a>'
      +'<button class="btn" id="copyEmailBtn2" type="button">Copy email address</button>'
      +'</div>'
      +'<p style="margin:10px 0 0;font-size:13px;color:var(--faint)">'+esc(V.updatedNote)+'</p>'
      +'<div class="toast" id="toast2" role="status" aria-live="polite" style="text-align:left;margin-top:8px"></div>'
      +'</div></div>';

    /* Contact */
    var K=D.contact;
    document.getElementById('view-contact').innerHTML=
      viewHead(K.folio,K.heading,null)
      +'<div class="contact-box"><div><h2>'+esc(K.boxHeading)+'</h2><p>'+K.boxTextHtml+'</p></div>'
      +'<div class="contact-actions">'
      +'<a class="btn" href="mailto:'+escA(P.email)+'?subject='+encodeURIComponent(K.emailSubject)+'">Send an email</a>'
      +'<button class="btn secondary" id="copyEmailBtn" type="button">Copy '+esc(P.email)+'</button>'
      +'<div class="toast" id="toast" role="status" aria-live="polite"></div>'
      +'</div></div>';
  }

  function init(D){
    var VIEWS=['about','publications','writing','stories']
      .concat(D.chronicles.stories.map(function(s){return s.id;}),['cv','contact']);
    var TITLES={about:D.aboutTabTitle,publications:D.publications.tabTitle,writing:D.newspaper.tabTitle,
      stories:D.chronicles.tabTitle,cv:D.cv.tabTitle,contact:D.contact.tabTitle};
    D.chronicles.stories.forEach(function(s){TITLES[s.id]=s.tabTitle;});
    var sections={};
    VIEWS.forEach(function(v){ sections[v]=document.getElementById('view-'+v); });
    var navLinks=Array.prototype.slice.call(document.querySelectorAll('[data-view-link]'));
    var topLinks=Array.prototype.slice.call(document.querySelectorAll('#navLinks a'));
    var menuBtn=document.getElementById('menuBtn');
    var nav=document.getElementById('navLinks');

    function viewFromHash(){
      var h=(window.location.hash||'').replace('#','');
      return VIEWS.indexOf(h)>=0 ? h : 'about';
    }
    function showView(name){
      VIEWS.forEach(function(v){ if(sections[v]) sections[v].hidden = (v!==name); });
      topLinks.forEach(function(a){ var k=a.getAttribute('data-view-link'); a.classList.toggle('active', name===k || (k==='stories' && name.indexOf('story-')===0)); });
      document.title=TITLES[name]||TITLES.about;
      window.scrollTo(0,0);
    }
    function closeMenu(){
      if(nav) nav.classList.remove('open');
      if(menuBtn) menuBtn.setAttribute('aria-expanded','false');
    }
    if(menuBtn&&nav){
      menuBtn.addEventListener('click',function(){
        var open=nav.classList.toggle('open');
        menuBtn.setAttribute('aria-expanded', open?'true':'false');
      });
    }
    navLinks.forEach(function(a){ a.addEventListener('click',closeMenu); });
    window.addEventListener('hashchange',function(){ showView(viewFromHash()); });
    showView(viewFromHash());

    function copyEmail(toastId){
      var email=D.profile.email;
      var toast=document.getElementById(toastId);
      function done(msg){ if(toast){ toast.textContent=msg; setTimeout(function(){toast.textContent='';},2600);} }
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(email).then(function(){done('Email copied to clipboard');}).catch(function(){done(email);});
      } else {
        var ta=document.createElement('textarea'); ta.value=email; document.body.appendChild(ta); ta.select();
        try{document.execCommand('copy'); done('Email copied to clipboard');}catch(e){done(email);}
        document.body.removeChild(ta);
      }
    }
    // newspaper tabs — Fact-Check is the default panel; News holds the clippings
    var newsTabs=Array.prototype.slice.call(document.querySelectorAll('[data-news-tab]'));
    var newsPanels={factcheck:document.getElementById('panel-factcheck'),news:document.getElementById('panel-news')};
    function showNewsTab(key){
      newsTabs.forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-news-tab')===key?'true':'false'); });
      Object.keys(newsPanels).forEach(function(k){ if(newsPanels[k]) newsPanels[k].hidden=(k!==key); });
    }
    newsTabs.forEach(function(b){ b.addEventListener('click',function(){ showNewsTab(b.getAttribute('data-news-tab')); }); });

    var cb=document.getElementById('copyEmailBtn'); if(cb) cb.addEventListener('click',function(){copyEmail('toast');});
    var cb2=document.getElementById('copyEmailBtn2'); if(cb2) cb2.addEventListener('click',function(){copyEmail('toast2');});

    // lightbox for clippings — presents each article as its two print parts
    var lb=document.getElementById('lightbox'), lbImg=document.getElementById('lbImg'), lbImg2=document.getElementById('lbImg2'), lbCap=document.getElementById('lbCap'), lbJump=document.getElementById('lbJump'), lbClose=document.getElementById('lbClose'), lbPart2Tag=document.getElementById('lbPart2Tag');
    var lastFocus=null;
    function openLb(btn){
      lastFocus=btn;
      lbImg.src=btn.getAttribute('data-full');
      var fig=btn.closest?btn.closest('figure'):null;
      var firstBtn=fig?fig.querySelector('.clip-btn'):btn;
      var img=firstBtn?firstBtn.querySelector('img'):null;
      lbImg.alt=img?img.alt:'';
      var full2=btn.getAttribute('data-full2');
      if(full2){
        lbImg2.src=full2;
        lbImg2.alt=btn.getAttribute('data-alt2')||'';
        lbImg2.hidden=false;
        lbPart2Tag.textContent='Part 2 · The continuation (jump)';
      } else {
        lbImg2.removeAttribute('src');
        lbImg2.hidden=true;
        lbPart2Tag.textContent='About the second part';
      }
      lbCap.textContent=btn.getAttribute('data-cap')||'';
      lbJump.textContent=btn.getAttribute('data-jump')||'';
      lb.classList.add('open');
      document.body.style.overflow='hidden';
      lbClose.focus();
    }
    function closeLb(){
      lb.classList.remove('open');
      lbImg.removeAttribute('src');
      lbImg2.removeAttribute('src');
      document.body.style.overflow='';
      if(lastFocus) lastFocus.focus();
    }
    Array.prototype.forEach.call(document.querySelectorAll('.clip-btn'),function(b){ b.addEventListener('click',function(){ openLb(b); }); });
    lbClose.addEventListener('click',closeLb);
    lb.addEventListener('click',function(e){ if(e.target===lb) closeLb(); });
    document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&lb.classList.contains('open')) closeLb(); });
  }

  function showError(err){
    mainEl.innerHTML='<section class="view"><div class="view-head"><h2>Content unavailable</h2>'
      +'<p>The content of this site could not be loaded'+(err&&err.message?' ('+esc(err.message)+')':'')
      +'. Please check your connection and reload the page.</p></div></section>';
  }

  if(window.fetch){
    fetch('assets/content.json').then(function(res){
      if(!res.ok) throw new Error('content file returned HTTP '+res.status);
      return res.json();
    }).then(function(D){
      render(D);
      init(D);
    }).catch(showError);
  } else {
    showError(new Error('this browser cannot load the content file'));
  }
})();
</script>
</body>
</html>
